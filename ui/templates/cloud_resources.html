{% extends "base.html" %}

{% block title %}Cloud Resources - Wasteless.io{% endblock %}

{% block content %}
<style>
@keyframes shimmer {
    0%   { background-position: -800px 0; }
    100% { background-position: 800px 0; }
}
.skeleton-row td {
    padding: 0.4rem 0.5rem;
}
.skeleton-cell {
    display: inline-block;
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--border-color) 25%, var(--bg-secondary) 50%, var(--border-color) 75%);
    background-size: 800px 100%;
    animation: shimmer 1.4s infinite linear;
}
</style>

<div class="page-header" style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
    <h1 style="margin-bottom: 0;">Cloud Resources</h1>
    <button onclick="loadInstances()" class="btn btn-outline" style="padding: 0.4rem 0.75rem;">
        <span>&#8635;</span> Refresh
    </button>
</div>

<!-- Filters + Summary -->
<div class="card mb-1" style="padding: 0.75rem;">
    <form method="get" action="/cloud-resources" id="filter-form">
        <div style="display: flex; gap: 1rem; align-items: end; flex-wrap: wrap;">
            <div class="form-group" style="margin: 0;">
                <label class="form-label" style="font-size: 0.75rem; margin-bottom: 0.25rem;">State</label>
                <select name="state_filter" class="form-select" style="padding: 0.4rem;" onchange="this.form.submit()">
                    <option value="all" {% if state_filter == 'all' %}selected{% endif %}>All States</option>
                    <option value="running" {% if state_filter == 'running' %}selected{% endif %}>Running</option>
                    <option value="stopped" {% if state_filter == 'stopped' %}selected{% endif %}>Stopped</option>
                    <option value="terminated" {% if state_filter == 'terminated' %}selected{% endif %}>Terminated</option>
                </select>
            </div>
            <div class="form-group" style="margin: 0;">
                <label class="form-label" style="font-size: 0.75rem; margin-bottom: 0.25rem;">Region</label>
                <select name="region_filter" class="form-select" style="padding: 0.4rem;" onchange="this.form.submit()">
                    <option value="all" {% if region_filter == 'all' %}selected{% endif %}>All Regions</option>
                    {% for region in regions %}
                    <option value="{{ region }}" {% if region_filter == region %}selected{% endif %}>{{ region }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-outline" style="padding: 0.4rem 0.75rem;">Apply</button>

            <div style="margin-left: auto; display: flex; gap: 1.5rem; font-size: 0.85rem; align-items: center;">
                <span><strong id="total-count">—</strong> instances</span>
                <span class="text-success"><strong id="running-count">—</strong> running</span>
                <span class="text-muted"><strong id="stopped-count">—</strong> stopped</span>
            </div>
        </div>
    </form>
</div>

<!-- Instances Table -->
<div class="card" style="padding: 0.75rem;">
    <div class="table-container">
        <table style="font-size: 0.85rem;">
            <thead>
                <tr>
                    <th style="padding: 0.5rem;">Instance ID</th>
                    <th style="padding: 0.5rem;">Name</th>
                    <th style="padding: 0.5rem;">Type</th>
                    <th style="padding: 0.5rem;">State</th>
                    <th style="padding: 0.5rem;">Region</th>
                    <th style="padding: 0.5rem;">Public IP</th>
                    <th style="padding: 0.5rem;">Private IP</th>
                    <th style="padding: 0.5rem;">Launch Time</th>
                </tr>
            </thead>
            <tbody id="instances-tbody">
                <!-- Skeleton rows shown while loading -->
                {% for _ in range(5) %}
                <tr class="skeleton-row">
                    <td><span class="skeleton-cell" style="width:110px"></span></td>
                    <td><span class="skeleton-cell" style="width:90px"></span></td>
                    <td><span class="skeleton-cell" style="width:60px"></span></td>
                    <td><span class="skeleton-cell" style="width:60px"></span></td>
                    <td><span class="skeleton-cell" style="width:80px"></span></td>
                    <td><span class="skeleton-cell" style="width:90px"></span></td>
                    <td><span class="skeleton-cell" style="width:90px"></span></td>
                    <td><span class="skeleton-cell" style="width:110px"></span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
const STATE_BADGES = {
    running:    '<span class="badge badge-success">running</span>',
    stopped:    '<span class="badge badge-warning">stopped</span>',
    terminated: '<span class="badge badge-danger">terminated</span>',
    pending:    '<span class="badge badge-info">pending</span>',
};

function renderRow(inst) {
    const badge = STATE_BADGES[inst.state] || `<span class="badge">${inst.state}</span>`;
    return `<tr>
        <td style="padding:0.4rem 0.5rem"><code style="font-size:0.75rem">${inst.instance_id}</code></td>
        <td style="padding:0.4rem 0.5rem"><span style="font-weight:500">${inst.name}</span></td>
        <td style="padding:0.4rem 0.5rem"><span style="font-size:0.8rem">${inst.type}</span></td>
        <td style="padding:0.4rem 0.5rem">${badge}</td>
        <td style="padding:0.4rem 0.5rem"><span style="font-size:0.8rem">${inst.region}</span></td>
        <td style="padding:0.4rem 0.5rem"><code style="font-size:0.75rem">${inst.public_ip}</code></td>
        <td style="padding:0.4rem 0.5rem"><code style="font-size:0.75rem">${inst.private_ip}</code></td>
        <td style="padding:0.4rem 0.5rem"><span style="font-size:0.8rem">${inst.launch_time}</span></td>
    </tr>`;
}

async function loadInstances() {
    const tbody = document.getElementById('instances-tbody');

    // Show skeleton while (re)loading
    tbody.innerHTML = `{% for _ in range(5) %}<tr class="skeleton-row">
        <td><span class="skeleton-cell" style="width:110px"></span></td>
        <td><span class="skeleton-cell" style="width:90px"></span></td>
        <td><span class="skeleton-cell" style="width:60px"></span></td>
        <td><span class="skeleton-cell" style="width:60px"></span></td>
        <td><span class="skeleton-cell" style="width:80px"></span></td>
        <td><span class="skeleton-cell" style="width:90px"></span></td>
        <td><span class="skeleton-cell" style="width:90px"></span></td>
        <td><span class="skeleton-cell" style="width:110px"></span></td>
    </tr>{% endfor %}`;
    document.getElementById('total-count').textContent   = '—';
    document.getElementById('running-count').textContent = '—';
    document.getElementById('stopped-count').textContent = '—';

    const params = new URLSearchParams({
        state_filter:  '{{ state_filter }}',
        region_filter: '{{ region_filter }}'
    });

    try {
        const res  = await fetch(`/api/cloud-resources?${params}`);
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--danger)">Server error: ${text.slice(0, 300)}</td></tr>`;
            return;
        }

        if (!res.ok) {
            const detail = data.detail || `HTTP ${res.status}`;
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--danger)">Error: ${detail}</td></tr>`;
            return;
        }

        document.getElementById('total-count').textContent   = data.total_count;
        document.getElementById('running-count').textContent = data.running_count;
        document.getElementById('stopped-count').textContent = data.stopped_count;

        if (data.instances.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-muted)">No instances found matching your filters</td></tr>`;
        } else {
            tbody.innerHTML = data.instances.map(renderRow).join('');
        }
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--danger)">Network error: ${err.message}</td></tr>`;
    }
}

loadInstances();
</script>
{% endblock %}
